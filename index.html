<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Qwen3-TTS WASM 离线前端配音系统" />
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'wasm-unsafe-eval' https://static.cloudflareinsights.com 'sha256-t90YM5+oOsjQMoSomLKl+OquWF3vF42r0GMVrp2VkaY=';
      worker-src 'self' blob:;
      connect-src 'self' http://localhost:* http://127.0.0.1:* https:;
      img-src 'self' data:;
      media-src 'self' blob:;
      style-src 'self' 'unsafe-inline';
    " />
    <!-- CSP 放行 Cloudflare Web Analytics（保留分析）：
         - https://static.cloudflareinsights.com 放行边缘注入的外部 beacon.min.js（报错2）
         - 'sha256-t90YM5+oOsjQMoSomLKl+OquWF3vF42r0GMVrp2VkaY=' 放行其内联 bootstrap（报错1）
         - nonce 不可行：meta CSP 为静态文件，Cloudflare Pages 无法按请求动态生成 nonce
         - 注意：Cloudflare 若更新 loader，hash 会失效需同步更新；彻底干净方案是在
           Cloudflare 控制台关闭 Web Analytics 注入，届时本行可去掉域名与 hash 恢复严格 CSP。
         connect-src 已含 https:，beacon 上报请求不受限。 -->
    <title>Qwen3-TTS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
