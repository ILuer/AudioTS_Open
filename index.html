<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Qwen3-TTS WASM 离线前端配音系统" />
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'wasm-unsafe-eval';
      worker-src 'self' blob:;
      connect-src 'self' http://localhost:* http://127.0.0.1:* https:;
      img-src 'self' data:;
      media-src 'self' blob:;
      style-src 'self' 'unsafe-inline';
    " />
    <!-- 说明：Cloudflare Web Analytics / Bot Management 会在边缘向 HTML 注入一段
         内联分析 loader（指纹 sha256-IN8UU4deU1saBVsH0I0cYqxc1Jx8BAd3AUiK3YR5iCY=），
         被本严格 CSP 的 script-src（无 'unsafe-inline'）拦截。故在 Cloudflare 控制台
         关闭 Web Analytics 注入，本处不再放行 static.cloudflareinsights.com，保持 CSP 严格。
         beacon.min.js 被浏览器 Tracking Prevention 拦截属客户端行为，关分析后不再请求。 -->
    <title>Qwen3-TTS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
